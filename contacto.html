<body data-page="contacto">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <header id="site-header" class="site-header"></header>
    <div id="site-terminal" class="site-terminal"></div>
    <main id="main-content" class="container page-main">

        <div class="terminal-eyebrow">root@eldesiempre:/contacto# <span>mail -s contacto</span></div>
        <h2>Contacto</h2>
        <p class="section-intro">¿Tienes alguna consulta o has encontrado un error? Escríbenos.</p>

        <form class="contact-form" id="form-contacto">
            <div class="honeypot" aria-hidden="true">
                <label for="contact-website">No rellenar</label>
                <input type="text" id="contact-website" tabindex="-1" autocomplete="off">
            </div>
            <div class="form-field">
                <label for="contact-nombre">Tu nombre</label>
                <input type="text" id="contact-nombre" placeholder="Nombre" maxlength="100" autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="contact-email">Tu correo</label>
                <input type="email" id="contact-email" placeholder="tu@correo.com" maxlength="150" autocomplete="email" required>
            </div>
            <div class="form-field">
                <label for="contact-asunto">Asunto</label>
                <input type="text" id="contact-asunto" placeholder="Asunto" maxlength="150" required>
            </div>
            <div class="form-field">
                <label for="contact-mensaje">Mensaje</label>
                <textarea id="contact-mensaje" placeholder="Tu mensaje..." maxlength="4000" required></textarea>
            </div>
            <button type="submit" class="btn-primary form-submit">Enviar mensaje</button>
            <div id="contact-result" class="tool-result" aria-live="polite" hidden></div>
        </form>
        
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <div id="site-modals"></div>
    <div id="toast-container" role="status" aria-live="polite"></div>
    <script type="module" src="js/pages/contacto.js"></script>
</body>
</html>
