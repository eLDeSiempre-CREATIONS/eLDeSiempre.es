<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard Admin | eLDeSiempre</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #admin-curtain { position: fixed; inset: 0; background: var(--bg-color); z-index: 99999; display: flex; justify-content: center; align-items: center; color: var(--neon-green); font-family: monospace; font-size: 1.2rem; text-align: center; padding: 20px;}
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 10px 20px; cursor: pointer; border-radius: 4px; font-family: inherit; }
        .tab-btn.active { background: var(--neon-blue); color: var(--bg-color); border-color: var(--neon-blue); font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; }
        .admin-table th, .admin-table td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        .admin-table th { background: var(--card-bg); color: var(--neon-green); }
        .admin-form { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid var(--border); }
        .admin-form input, .admin-form textarea, .admin-form select { margin-bottom: 10px; }
    </style>
</head>
<body class="locked">
    <div id="admin-curtain">&gt; Verificando credenciales de administrador...</div>

    <header>
        <div class="logo-text">eLDeSiempre<span>.es</span> | Admin</div>
        <nav>
            <button class="nav-btn" onclick="window.location.href='index.html'">Volver a la Web</button>
            <button class="nav-btn" style="color:var(--danger);" onclick="cerrarSesion()">Salir</button>
        </nav>
    </header>

    <main class="container" style="display:none;" id="admin-main">
        <h2>Panel de Control Global</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('recursos')">Recursos</button>
            <button class="tab-btn" onclick="switchTab('usuarios')">Usuarios</button>
            <button class="tab-btn" onclick="switchTab('guias')">Guías</button>
            <button class="tab-btn" onclick="switchTab('logs')">Logs</button>
        </div>

        <div id="tab-recursos" class="tab-content active">
            <div class="admin-form">
                <h3 id="form-rec-titulo">Añadir Nuevo Recurso</h3>
                <form id="form-recurso" style="display:grid; gap:10px; margin-top:10px;">
                    <input type="hidden" id="rec-id">
                    <select id="rec-cat" class="tool-input" required><option value="">Cargando categorías...</option></select>
                    <input type="text" id="rec-titulo" class="tool-input" placeholder="Título" required>
                    <input type="url" id="rec-url" class="tool-input" placeholder="https://..." required>
                    <textarea id="rec-desc" class="tool-input" placeholder="Descripción" required></textarea>
                    <input type="text" id="rec-tipo" class="tool-input" placeholder="Tipo (Curso, Libro, etc)" required>
                    <input type="text" id="rec-ideal" class="tool-input" placeholder="Ideal para...">
                    <button type="submit" class="btn-primary" id="btn-guardar-rec">Guardar Recurso</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar-rec" style="display:none;" onclick="cancelarEdicionRecurso()">Cancelar Edición</button>
                </form>
            </div>
            <input type="text" id="search-recursos" class="tool-input" placeholder="Buscar recursos por título o descripción..." oninput="buscarRecursos()">
            <div id="lista-recursos"></div>
        </div>

        <div id="tab-usuarios" class="tab-content">
            <div id="lista-usuarios"></div>
        </div>

        <div id="tab-guias" class="tab-content">
            <div class="admin-form">
                <h3 id="form-guia-titulo">Añadir Nueva Guía</h3>
                <form id="form-guia" style="display:grid; gap:10px; margin-top:10px;">
                    <input type="hidden" id="guia-id">
                    <input type="text" id="guia-slug" class="tool-input" placeholder="slug-de-la-guia" required>
                    <input type="text" id="guia-titulo" class="tool-input" placeholder="Título de la guía" required>
                    <select id="guia-nivel" class="tool-input"><option value="Principiante">Principiante</option><option value="Fácil">Fácil</option><option value="Medio">Medio</option><option value="Difícil">Difícil</option><option value="Experto">Experto</option></select>
                    <select id="guia-login" class="tool-input"><option value="0">Pública</option><option value="1">Requiere Login</option></select>
                    <textarea id="guia-contenido" class="tool-input" rows="5" placeholder="Contenido HTML..." required></textarea>
                    <button type="submit" class="btn-primary" id="btn-guardar-guia">Guardar Guía</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar-guia" style="display:none;" onclick="cancelarEdicionGuia()">Cancelar Edición</button>
                </form>
            </div>
            <div id="lista-guias"></div>
        </div>

        <div id="tab-logs" class="tab-content">
            <div id="lista-logs"></div>
        </div>
    </main>

    <script type="module" src="js/pages/admin.js?v=3"></script>
</body>
</html>
