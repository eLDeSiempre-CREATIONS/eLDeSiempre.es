<body data-page="reset">
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <header id="site-header" class="site-header"></header>
    <div id="site-terminal" class="site-terminal"></div>
    <main id="main-content" class="container page-main auth-layout auth-layout--single">

        <form class="auth-form" id="form-reset">
            <p class="terminal-eyebrow">root@eldesiempre:~# <span>passwd</span></p>
            <h2>Nueva Contraseña</h2>
            <p class="tool-help">Introduce tu nueva contraseña. Debe tener al menos 8 caracteres.</p>
            <div class="form-field">
                <label for="reset-password">Contraseña</label>
                <input type="password" id="reset-password" placeholder="••••••••" required minlength="8" maxlength="200" autocomplete="new-password">
            </div>
            <div class="form-field">
                <label for="reset-password-confirm">Confirmar contraseña</label>
                <input type="password" id="reset-password-confirm" placeholder="••••••••" required minlength="8" maxlength="200" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary form-submit">Cambiar contraseña</button>
        </form>
        
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <div id="site-modals"></div>
    <div id="toast-container" role="status" aria-live="polite"></div>
    <script type="module" src="js/pages/reset.js"></script>
</body>
</html>
